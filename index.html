<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DGInside</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1a3a6b;
    --primary-dark: #0d2255;
    --accent: #ffcc00;
    --danger: #cc0000;
    --bg: #e8eaed;
    --surface: #ffffff;
    --border: #d0d3d8;
    --text: #222;
    --text-muted: #666;
    --text-faint: #999;
    --notice-bg: #fffce8;
    --best-bg: #fff5f0;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Malgun Gothic', '맑은 고딕', Dotum, sans-serif; font-size: 13px; }

  a { color: var(--primary); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  button { cursor: pointer; font-family: inherit; }

  /* ── LOADING ── */
  #loading-screen {
    position: fixed; inset: 0; background: var(--primary); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s;
  }
  #loading-screen.fade-out { opacity: 0; pointer-events: none; }
  .loading-logo { font-size: 42px; font-weight: 900; color: #fff; letter-spacing: -2px; margin-bottom: 12px; }
  .loading-logo span { color: var(--accent); }
  .loading-spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 12px; }

  /* ── HEADER ── */
  #header { background: var(--primary); color: #fff; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #header-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  #logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: -1px; cursor: pointer; }
  #logo span { color: var(--accent); }
  #header-user { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .user-info { color: rgba(255,255,255,0.8); }
  .user-info b { color: #fff; }
  .header-btn {
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    padding: 4px 12px; font-size: 12px; border-radius: 3px; transition: background 0.15s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.22); }
  .header-btn.primary-btn { background: var(--accent); color: #222; border-color: var(--accent); font-weight: bold; }
  .header-btn.primary-btn:hover { background: #e6b800; }

  /* ── NAV ── */
  #nav { background: var(--primary-dark); display: flex; overflow-x: auto; }
  #nav::-webkit-scrollbar { display: none; }
  .nav-item {
    color: rgba(255,255,255,0.7); padding: 8px 16px; font-size: 13px; cursor: pointer;
    white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  .nav-item:hover, .nav-item.active { color: #fff; border-bottom-color: var(--accent); }

  /* ── LAYOUT ── */
  #main-layout { display: flex; gap: 10px; padding: 10px 10px; max-width: 1200px; margin: 0 auto; }
  #sidebar-left { width: 160px; flex-shrink: 0; }
  #center-col { flex: 1; min-width: 0; }
  #sidebar-right { width: 170px; flex-shrink: 0; }

  @media (max-width: 900px) { #sidebar-left, #sidebar-right { display: none; } }

  /* ── SIDE BOXES ── */
  .sbox { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  .sbox-title { background: var(--primary); color: #fff; padding: 6px 10px; font-size: 12px; font-weight: bold; }
  .sbox-body {}
  .slink { display: block; padding: 5px 10px; font-size: 12px; color: var(--text); border-bottom: 1px dotted #eee; cursor: pointer; }
  .slink:hover { background: #f0f4ff; color: var(--primary); }
  .slink:last-child { border-bottom: none; }

  /* ── BOARD ── */
  .board-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .board-head { padding: 10px 14px; border-bottom: 2px solid var(--primary); display: flex; align-items: center; justify-content: space-between; }
  .board-head-title { font-size: 17px; font-weight: bold; color: var(--primary); }
  .board-head-sub { font-size: 11px; color: var(--text-muted); }

  /* post table */
  .post-table { width: 100%; border-collapse: collapse; }
  .post-table th { background: #f4f6fb; border-bottom: 1px solid var(--border); padding: 6px 8px; font-size: 12px; text-align: center; color: var(--text-muted); font-weight: bold; }
  .post-table td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; font-size: 12px; vertical-align: middle; }
  .post-table tr:hover td { background: #f8f9ff; cursor: pointer; }
  .col-num { width: 55px; text-align: center; color: var(--text-muted); }
  .col-title { }
  .col-nick { width: 90px; text-align: center; }
  .col-date { width: 70px; text-align: center; color: var(--text-muted); }
  .col-view { width: 50px; text-align: center; color: var(--text-muted); }
  .col-rec { width: 45px; text-align: center; color: #e06000; font-weight: bold; }
  .post-title-link { font-size: 13px; color: var(--text); }
  .post-title-link:hover { color: var(--primary); }
  .reply-cnt { color: var(--danger); font-size: 12px; font-weight: bold; }
  .notice-row td { background: var(--notice-bg); }
  .best-row td { background: var(--best-bg); }
  .label-notice { color: var(--danger); font-weight: bold; font-size: 11px; }
  .label-best { color: #e06000; font-weight: bold; font-size: 11px; }
  .nick-fixed { color: var(--primary); font-weight: bold; }
  .nick-flow { color: var(--text-muted); }
  .nick-ip { color: var(--text-faint); font-size: 10px; }

  /* write area */
  .write-area { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; }
  .write-btn { background: var(--primary); color: #fff; border: none; padding: 7px 18px; font-size: 13px; font-weight: bold; border-radius: 3px; }
  .write-btn:hover { background: var(--primary-dark); }

  /* pagination */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 3px; padding: 10px; flex-wrap: wrap; }
  .page-btn { border: 1px solid var(--border); background: var(--surface); padding: 4px 9px; font-size: 12px; border-radius: 2px; color: var(--text); }
  .page-btn:hover { border-color: var(--primary); color: var(--primary); background: #e8f0ff; }
  .page-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ── POST VIEW ── */
  .post-view-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
  .pv-header { padding: 14px 16px; border-bottom: 2px solid var(--primary); }
  .pv-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .pv-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-muted); }
  .pv-body { padding: 16px; min-height: 120px; line-height: 1.8; font-size: 14px; white-space: pre-wrap; border-bottom: 1px solid #eee; }
  .pv-actions { display: flex; gap: 8px; justify-content: center; padding: 14px; border-bottom: 1px solid #eee; }
  .vote-up { background: #e03000; color: #fff; border: none; padding: 9px 28px; font-size: 14px; font-weight: bold; border-radius: 3px; }
  .vote-down { background: #4455aa; color: #fff; border: none; padding: 9px 28px; font-size: 14px; border-radius: 3px; }
  .vote-up:hover { background: #c02800; }
  .vote-down:hover { background: #334499; }
  .pv-nav-btns { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; }
  .pv-nav-btn { background: #888; color: #fff; border: none; padding: 6px 14px; font-size: 12px; border-radius: 2px; }
  .pv-nav-btn:hover { background: #666; }
  .pv-nav-btn.blue { background: var(--primary); }
  .pv-nav-btn.blue:hover { background: var(--primary-dark); }
  .pv-nav-btn.red { background: var(--danger); }

  /* ── COMMENTS ── */
  .comment-section { padding: 0 16px 16px; }
  .comment-section-title { font-size: 13px; font-weight: bold; color: var(--primary); padding: 12px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 0; }
  .comment-item { border-bottom: 1px solid #f0f0f0; padding: 9px 4px; }
  .cm-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; }
  .cm-nick { font-weight: bold; }
  .cm-time { color: var(--text-faint); }
  .cm-del { margin-left: auto; color: var(--text-faint); cursor: pointer; }
  .cm-del:hover { color: var(--danger); }
  .cm-body { font-size: 13px; line-height: 1.5; }
  .cm-write { margin-top: 12px; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; background: #f8f9fb; }
  .cm-write-top { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .cm-write-top input { border: 1px solid var(--border); padding: 5px 8px; font-size: 12px; font-family: inherit; border-radius: 2px; background: #fff; }
  .cm-write-top input[type=text] { width: 110px; }
  .cm-write-top input[type=password] { width: 90px; }
  .cm-write-body { display: flex; }
  .cm-write-body textarea { flex: 1; border: none; padding: 10px; font-size: 13px; font-family: inherit; min-height: 68px; resize: none; background: transparent; outline: none; }
  .cm-submit { background: var(--primary); color: #fff; border: none; padding: 0 18px; font-size: 12px; font-weight: bold; }
  .cm-submit:hover { background: var(--primary-dark); }

  /* ── WRITE FORM ── */
  .write-form-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  .write-form-title { font-size: 16px; font-weight: bold; color: var(--primary); padding-bottom: 10px; border-bottom: 2px solid var(--primary); margin-bottom: 14px; }
  .form-row { margin-bottom: 10px; }
  .form-label { font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; display: block; }
  .form-input { width: 100%; border: 1px solid var(--border); padding: 7px 10px; font-size: 13px; font-family: inherit; border-radius: 2px; outline: none; transition: border-color 0.15s; }
  .form-input:focus { border-color: var(--primary); }
  .form-textarea { width: 100%; border: 1px solid var(--border); padding: 10px; font-size: 13px; font-family: inherit; min-height: 220px; resize: vertical; border-radius: 2px; outline: none; }
  .form-textarea:focus { border-color: var(--primary); }
  .form-row-inline { display: flex; gap: 8px; margin-bottom: 10px; }
  .form-row-inline .form-input { flex: 1; }
  .form-btns { display: flex; gap: 6px; margin-top: 12px; }
  .form-submit { background: var(--primary); color: #fff; border: none; padding: 9px 22px; font-size: 13px; font-weight: bold; border-radius: 3px; }
  .form-cancel { background: #888; color: #fff; border: none; padding: 9px 22px; font-size: 13px; border-radius: 3px; }

  /* ── NICK MODAL ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--surface); border: 2px solid var(--primary); border-radius: 6px; width: 92%; max-width: 400px; overflow: hidden; }
  .modal-head { background: var(--primary); color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 15px; }
  .modal-x { background: none; border: none; color: #fff; font-size: 20px; line-height: 1; padding: 0 4px; }
  .modal-body { padding: 20px; }
  .modal-body p { font-size: 12px; color: var(--text-muted); line-height: 1.7; margin-bottom: 12px; }
  .modal-input { width: 100%; border: 2px solid var(--border); padding: 10px 12px; font-size: 15px; font-family: inherit; border-radius: 3px; outline: none; transition: border-color 0.15s; margin-bottom: 6px; }
  .modal-input:focus { border-color: var(--primary); }
  .modal-msg { font-size: 12px; min-height: 18px; margin-bottom: 10px; }
  .modal-msg.ok { color: #009900; }
  .modal-msg.err { color: var(--danger); }
  .modal-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 11px; font-size: 14px; font-weight: bold; border-radius: 3px; margin-bottom: 6px; }
  .modal-submit:hover { background: var(--primary-dark); }
  .modal-secondary { width: 100%; background: #888; color: #fff; border: none; padding: 9px; font-size: 13px; border-radius: 3px; }

  /* realtime */
  .rt-item { display: flex; gap: 6px; padding: 5px 10px; border-bottom: 1px dotted #eee; font-size: 12px; align-items: flex-start; }
  .rt-rank { color: var(--danger); font-weight: bold; min-width: 16px; flex-shrink: 0; }
  .rt-txt { color: var(--text); cursor: pointer; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .rt-txt:hover { color: var(--primary); }

  /* empty state */
  .empty-msg { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* toast */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: #333; color: #fff; padding: 10px 20px; border-radius: 4px; font-size: 13px; z-index: 9998; transition: transform 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* breadcrumb */
  .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .breadcrumb span { cursor: pointer; color: var(--primary); }
  .breadcrumb span:hover { text-decoration: underline; }

  /* skeleton */
  .skel { background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%); background-size: 200% 100%; animation: skel 1.2s infinite; border-radius: 3px; display: inline-block; }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="loading-logo">DG<span>Inside</span></div>
  <div class="loading-spinner"></div>
  <div class="loading-msg">연결 중...</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Header -->
<div id="header">
  <div id="header-top">
    <div id="logo" onclick="goHome()">DG<span>Inside</span></div>
    <div id="header-user">
      <span class="user-info" id="user-info-text">로딩 중...</span>
      <button class="header-btn" id="nick-btn" onclick="openNickModal()">닉네임 설정</button>
      <button class="header-btn primary-btn" onclick="goHome()">홈</button>
    </div>
  </div>
  <div id="nav">
    <div class="nav-item active" onclick="goHome()">전체글</div>
  </div>
</div>

<!-- Main -->
<div id="main-layout">
  <div id="sidebar-left">
    <div class="sbox">
      <div class="sbox-title">🔥 실시간 인기글</div>
      <div class="sbox-body" id="sb-realtime"><div class="slink">로딩 중...</div></div>
    </div>
  </div>

  <div id="center-col">
    <div id="view-board"></div>
    <div id="view-post" style="display:none"></div>
    <div id="view-write" style="display:none"></div>
  </div>

  <div id="sidebar-right">
    <div class="sbox">
      <div class="sbox-title">📋 최근 게시글</div>
      <div class="sbox-body" id="sb-recent"><div class="slink">로딩 중...</div></div>
    </div>
    <div class="sbox">
      <div class="sbox-title">📣 공지</div>
      <div class="sbox-body">
        <div class="slink">커뮤니티 이용규칙</div>
        <div class="slink">광고/문의 안내</div>
      </div>
    </div>
  </div>
</div>

<!-- Nick Modal -->
<div id="nick-overlay" class="overlay" style="display:none" onclick="closeNickModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3>닉네임 설정</h3>
      <button class="modal-x" onclick="closeNickModal()">✕</button>
    </div>
    <div class="modal-body">
      <p>닉네임을 설정하면 <b>고정닉</b>으로 활동할 수 있습니다.<br>중복 닉네임은 사용할 수 없습니다.</p>
      <input class="modal-input" id="nick-input" type="text" placeholder="닉네임 입력 (2~12자)" maxlength="12" oninput="checkNick(this.value)" onkeydown="if(event.key==='Enter')submitNick()" />
      <div class="modal-msg" id="nick-msg"></div>
      <div id="current-nick-info" style="font-size:12px;color:var(--primary);margin-bottom:10px;display:none"></div>
      <button class="modal-submit" onclick="submitNick()">닉네임 설정하기</button>
      <button class="modal-secondary" id="clear-nick-btn" style="display:none" onclick="clearNick()">유동닉으로 전환</button>
    </div>
  </div>
</div>

<!-- Firebase & App -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
import {
  getFirestore, collection, doc,
  addDoc, getDoc, getDocs, updateDoc, deleteDoc, setDoc,
  query, orderBy, limit, where, serverTimestamp, onSnapshot, increment
} from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuVfi5GZQTzl3OHofpQ1h0pxMTMN83HOA",
  authDomain: "testing-123-12.firebaseapp.com",
  projectId: "testing-123-12",
  storageBucket: "testing-123-12.firebasestorage.app",
  messagingSenderId: "763100622835",
  appId: "1:763100622835:web:aee0e68fce4ab6bc37ac86"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ── STATE ── */
const S = {
  uid: null,
  nickname: null,
  currentPostId: null,
  currentPage: 1,
  postsPerPage: 15,
  totalPosts: 0,
  unsubPost: null,
  unsubComments: null,
};

/* ── HELPERS ── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

function showLoading(msg) {
  const ls = document.getElementById('loading-screen');
  ls.querySelector('.loading-msg').textContent = msg || '로딩 중...';
  ls.style.display = 'flex';
  ls.classList.remove('fade-out');
}

function hideLoading() {
  const ls = document.getElementById('loading-screen');
  ls.classList.add('fade-out');
  setTimeout(() => { ls.style.display = 'none'; }, 400);
}

function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderNick(nick, nickType, ipHint) {
  if (nickType === 'fixed') return `<span class="nick-fixed">${esc(nick)}</span>`;
  return `<span class="nick-flow">${esc(nick)} <span class="nick-ip">(${esc(ipHint||'')})</span></span>`;
}

function showView(name) {
  ['board','post','write'].forEach(v => {
    document.getElementById('view-'+v).style.display = v === name ? 'block' : 'none';
  });
  if (S.unsubPost && name !== 'post') { S.unsubPost(); S.unsubPost = null; }
  if (S.unsubComments && name !== 'post') { S.unsubComments(); S.unsubComments = null; }
}

/* ── AUTH ── */
onAuthStateChanged(auth, async user => {
  if (user) {
    S.uid = user.uid;
    await loadUserProfile();
    hideLoading();
    renderBoard();
    loadSidebars();
  } else {
    showLoading('익명 로그인 중...');
    signInAnonymously(auth).catch(e => {
      document.querySelector('#loading-screen .loading-msg').textContent = '로그인 실패: ' + e.message;
    });
  }
});

async function loadUserProfile() {
  const ref = doc(db, 'users', S.uid);
  const snap = await getDoc(ref);
  if (snap.exists() && snap.data().nickname) {
    S.nickname = snap.data().nickname;
    updateUserDisplay();
  } else {
    S.nickname = null;
    updateUserDisplay();
  }
}

function updateUserDisplay() {
  const info = document.getElementById('user-info-text');
  const nickBtn = document.getElementById('nick-btn');
  if (S.nickname) {
    info.innerHTML = `<b>${esc(S.nickname)}</b> (고정닉)`;
    nickBtn.textContent = '닉네임 변경';
  } else {
    info.textContent = '유동닉 사용 중';
    nickBtn.textContent = '닉네임 설정';
  }
}

function getCurrentNick() {
  return S.nickname || 'ㅇㅇ';
}
function getNickType() {
  return S.nickname ? 'fixed' : 'flow';
}
function getIpHint() {
  // simple hash from uid for consistent IP hint
  const h = S.uid ? parseInt(S.uid.slice(-3), 16) % 256 : Math.floor(Math.random()*255);
  return h + '.xxx';
}

/* ── NICK MODAL ── */
window.openNickModal = function() {
  document.getElementById('nick-overlay').style.display = 'flex';
  const input = document.getElementById('nick-input');
  input.value = S.nickname || '';
  document.getElementById('nick-msg').textContent = '';
  const curr = document.getElementById('current-nick-info');
  const clearBtn = document.getElementById('clear-nick-btn');
  if (S.nickname) {
    curr.style.display = 'block';
    curr.textContent = `현재 닉네임: ${S.nickname}`;
    clearBtn.style.display = 'block';
  } else {
    curr.style.display = 'none';
    clearBtn.style.display = 'none';
  }
  setTimeout(() => input.focus(), 50);
};

window.closeNickModal = function(e) {
  if (!e || e.target === document.getElementById('nick-overlay')) {
    document.getElementById('nick-overlay').style.display = 'none';
  }
};

window.checkNick = async function(val) {
  const msg = document.getElementById('nick-msg');
  msg.className = 'modal-msg';
  if (!val || val.length < 2) { msg.textContent = '2자 이상 입력하세요.'; msg.classList.add('err'); return; }
  if (val.length > 12) { msg.textContent = '12자 이하로 입력하세요.'; msg.classList.add('err'); return; }
  if (val === S.nickname) { msg.textContent = '현재 닉네임과 동일합니다.'; msg.classList.add('err'); return; }
  // check duplicate
  const q = query(collection(db, 'users'), where('nickname', '==', val));
  const snap = await getDocs(q);
  if (!snap.empty) {
    msg.textContent = '이미 사용 중인 닉네임입니다.'; msg.classList.add('err');
  } else {
    msg.textContent = '사용 가능한 닉네임입니다!'; msg.classList.add('ok');
  }
};

window.submitNick = async function() {
  const val = document.getElementById('nick-input').value.trim();
  const msg = document.getElementById('nick-msg');
  if (!val || val.length < 2) { msg.className='modal-msg err'; msg.textContent='2자 이상 입력하세요.'; return; }
  if (val.length > 12) { msg.className='modal-msg err'; msg.textContent='12자 이하로 입력하세요.'; return; }
  if (val === S.nickname) { msg.className='modal-msg err'; msg.textContent='현재 닉네임과 동일합니다.'; return; }
  // re-check duplicate
  const q = query(collection(db, 'users'), where('nickname', '==', val));
  const snap = await getDocs(q);
  if (!snap.empty) { msg.className='modal-msg err'; msg.textContent='이미 사용 중인 닉네임입니다.'; return; }
  await setDoc(doc(db, 'users', S.uid), { nickname: val }, { merge: true });
  S.nickname = val;
  updateUserDisplay();
  closeNickModal();
  toast(`닉네임이 "${val}"(으)로 설정되었습니다.`);
};

window.clearNick = async function() {
  if (!confirm('유동닉으로 전환하시겠습니까?')) return;
  await setDoc(doc(db, 'users', S.uid), { nickname: null }, { merge: true });
  S.nickname = null;
  updateUserDisplay();
  closeNickModal();
  toast('유동닉으로 전환되었습니다.');
};

/* ── BOARD ── */
window.goHome = function() {
  S.currentPage = 1;
  showView('board');
  renderBoard();
};

async function renderBoard() {
  showView('board');
  const el = document.getElementById('view-board');
  el.innerHTML = `<div class="board-wrap"><div class="board-head"><div class="board-head-title">전체 게시판</div><div class="board-head-sub">로딩 중...</div></div><div class="empty-msg"><div class="skel" style="width:60%;height:14px;margin:0 auto 10px"></div><div class="skel" style="width:80%;height:14px;margin:0 auto 10px"></div><div class="skel" style="width:50%;height:14px;margin:0 auto"></div></div></div>`;

  try {
    const postsRef = collection(db, 'posts');
    const q = query(postsRef, orderBy('createdAt', 'desc'), limit(S.postsPerPage * S.currentPage + 20));
    const snap = await getDocs(q);
    const allDocs = snap.docs;
    S.totalPosts = allDocs.length;

    const notices = allDocs.filter(d => d.data().type === 'notice');
    const bests = allDocs.filter(d => d.data().type !== 'notice' && (d.data().rec||0) >= 10);
    const normals = allDocs.filter(d => d.data().type !== 'notice' && (d.data().rec||0) < 10);

    const displayed = [...notices.slice(0,2), ...bests.slice(0,3), ...normals.slice((S.currentPage-1)*S.postsPerPage, S.currentPage*S.postsPerPage)];

    el.innerHTML = `
      <div class="board-wrap">
        <div class="board-head">
          <div class="board-head-title">전체 게시판</div>
          <div class="board-head-sub">총 ${S.totalPosts}개 게시글</div>
        </div>
        <table class="post-table">
          <thead><tr>
            <th class="col-num">번호</th>
            <th class="col-title">제목</th>
            <th class="col-nick">닉네임</th>
            <th class="col-date">날짜</th>
            <th class="col-view">조회</th>
            <th class="col-rec">추천</th>
          </tr></thead>
          <tbody>${displayed.length ? displayed.map(d => renderPostRow(d)).join('') : '<tr><td colspan="6" class="empty-msg">아직 게시글이 없습니다.</td></tr>'}</tbody>
        </table>
        <div class="pagination">${renderPagination(Math.max(1, Math.ceil(normals.length / S.postsPerPage)))}</div>
        <div class="write-area">
          <button class="write-btn" onclick="showWriteForm()">글쓰기</button>
        </div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="board-wrap"><div class="empty-msg">불러오기 실패: ${e.message}</div></div>`;
  }
}

function renderPostRow(docSnap) {
  const d = docSnap.data();
  const id = docSnap.id;
  const isNotice = d.type === 'notice';
  const isBest = (d.rec||0) >= 10 && !isNotice;
  const rowCls = isNotice ? 'notice-row' : isBest ? 'best-row' : '';
  const numCell = isNotice ? '<span class="label-notice">공지</span>' : isBest ? '<span class="label-best">베스트</span>' : esc(d.num||'');
  const commentCnt = d.commentCount || 0;
  const replybadge = commentCnt > 0 ? `<span class="reply-cnt"> [${commentCnt}]</span>` : '';
  return `<tr class="${rowCls}" onclick="openPost('${id}')">
    <td class="col-num">${numCell}</td>
    <td class="col-title"><span class="post-title-link">${esc(d.title)}${replybadge}</span></td>
    <td class="col-nick">${renderNick(d.nick, d.nickType, d.ipHint)}</td>
    <td class="col-date">${formatDate(d.createdAt)}</td>
    <td class="col-view">${(d.views||0).toLocaleString()}</td>
    <td class="col-rec">${d.rec||0}</td>
  </tr>`;
}

function renderPagination(total) {
  let html = `<button class="page-btn" onclick="changePage(${S.currentPage-1})">◀</button>`;
  for (let i = 1; i <= total; i++) {
    html += `<button class="page-btn${i===S.currentPage?' on':''}" onclick="changePage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="changePage(${S.currentPage+1})">▶</button>`;
  return html;
}

window.changePage = function(p) {
  if (p < 1) return;
  S.currentPage = p;
  renderBoard();
  window.scrollTo(0, 0);
};

/* ── POST VIEW ── */
window.openPost = async function(postId) {
  if (S.unsubPost) S.unsubPost();
  if (S.unsubComments) S.unsubComments();
  S.currentPostId = postId;
  showView('post');

  // increment view
  try { await updateDoc(doc(db, 'posts', postId), { views: increment(1) }); } catch(e){}

  // realtime post listener
  S.unsubPost = onSnapshot(doc(db, 'posts', postId), snap => {
    if (!snap.exists()) { toast('삭제된 게시글입니다.'); goHome(); return; }
    renderPostView(snap);
  });

  // realtime comments listener
  S.unsubComments = onSnapshot(
    query(collection(db, 'posts', postId, 'comments'), orderBy('createdAt', 'asc')),
    snap => renderComments(snap.docs)
  );
};

function renderPostView(snap) {
  const d = snap.data();
  const id = snap.id;
  const isOwner = S.uid === d.authorUid;
  const el = document.getElementById('view-post');

  el.innerHTML = `
    <div class="breadcrumb"><span onclick="goHome()">홈</span> &gt; 전체 게시판</div>
    <div class="post-view-wrap">
      <div class="pv-header">
        <div class="pv-title">${esc(d.title)}</div>
        <div class="pv-meta">
          <span>작성자: ${renderNick(d.nick, d.nickType, d.ipHint)}</span>
          <span>조회 ${(d.views||0).toLocaleString()}</span>
          <span>${formatDate(d.createdAt)}</span>
          <span>추천 <b style="color:var(--danger)">${d.rec||0}</b></span>
        </div>
      </div>
      <div class="pv-body">${esc(d.content)}</div>
      <div class="pv-actions">
        <button class="vote-up" onclick="vote('${id}',1)">👍 추천 ${d.rec||0}</button>
        <button class="vote-down" onclick="vote('${id}',-1)">👎 비추천</button>
      </div>
      <div class="pv-nav-btns">
        <button class="pv-nav-btn" onclick="goHome()">목록</button>
        <button class="pv-nav-btn blue" onclick="showWriteForm()">글쓰기</button>
        ${isOwner ? `<button class="pv-nav-btn red" onclick="deletePost('${id}')">삭제</button>` : ''}
      </div>
      <div class="comment-section">
        <div class="comment-section-title" id="cm-title">댓글</div>
        <div id="comment-list"></div>
        <div class="cm-write">
          <div class="cm-write-top">
            <input type="text" id="cm-nick-input" value="${esc(getCurrentNick())}" placeholder="닉네임" ${S.nickname?'readonly':''} maxlength="12" />
            ${!S.nickname ? '<input type="password" id="cm-pw" placeholder="비밀번호(선택)" maxlength="20" />' : ''}
          </div>
          <div class="cm-write-body">
            <textarea id="cm-text" placeholder="댓글을 입력하세요." onkeydown="if(event.ctrlKey&&event.key==='Enter')submitComment('${id}')"></textarea>
            <button class="cm-submit" onclick="submitComment('${id}')">등록</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderComments(docs) {
  const list = document.getElementById('comment-list');
  const title = document.getElementById('cm-title');
  if (!list) return;
  if (title) title.textContent = `댓글 ${docs.length}개`;
  if (!docs.length) {
    list.innerHTML = '<div class="empty-msg" style="padding:16px">등록된 댓글이 없습니다.</div>';
    return;
  }
  list.innerHTML = docs.map(d => {
    const c = d.data();
    const isOwner = S.uid === c.authorUid;
    return `<div class="comment-item">
      <div class="cm-meta">
        ${renderNick(c.nick, c.nickType, c.ipHint)}
        <span class="cm-time">${formatDate(c.createdAt)}</span>
        ${isOwner ? `<span class="cm-del" onclick="deleteComment('${S.currentPostId}','${d.id}')">삭제</span>` : ''}
      </div>
      <div class="cm-body">${esc(c.text)}</div>
    </div>`;
  }).join('');
}

window.submitComment = async function(postId) {
  const text = document.getElementById('cm-text')?.value.trim();
  if (!text) { toast('댓글 내용을 입력하세요.'); return; }
  const nick = getCurrentNick();
  const nickType = getNickType();
  try {
    await addDoc(collection(db, 'posts', postId, 'comments'), {
      text, nick, nickType,
      ipHint: nickType === 'flow' ? getIpHint() : '',
      authorUid: S.uid,
      createdAt: serverTimestamp(),
    });
    await updateDoc(doc(db, 'posts', postId), { commentCount: increment(1) });
    document.getElementById('cm-text').value = '';
  } catch(e) { toast('댓글 등록 실패: ' + e.message); }
};

window.deleteComment = async function(postId, commentId) {
  if (!confirm('댓글을 삭제하시겠습니까?')) return;
  try {
    await deleteDoc(doc(db, 'posts', postId, 'comments', commentId));
    await updateDoc(doc(db, 'posts', postId), { commentCount: increment(-1) });
    toast('댓글이 삭제되었습니다.');
  } catch(e) { toast('삭제 실패: ' + e.message); }
};

window.vote = async function(postId, val) {
  try {
    await updateDoc(doc(db, 'posts', postId), { rec: increment(val) });
    toast(val > 0 ? '추천했습니다!' : '비추천했습니다.');
  } catch(e) { toast('오류: ' + e.message); }
};

window.deletePost = async function(postId) {
  if (!confirm('게시글을 삭제하시겠습니까?')) return;
  try {
    await deleteDoc(doc(db, 'posts', postId));
    toast('게시글이 삭제되었습니다.');
    goHome();
  } catch(e) { toast('삭제 실패: ' + e.message); }
};

/* ── WRITE ── */
window.showWriteForm = function() {
  showView('write');
  const el = document.getElementById('view-write');
  el.innerHTML = `
    <div class="breadcrumb"><span onclick="goHome()">홈</span> &gt; 전체 게시판 &gt; 글쓰기</div>
    <div class="write-form-wrap">
      <div class="write-form-title">글쓰기</div>
      <div class="form-row-inline">
        <input class="form-input" type="text" id="wf-nick" value="${esc(getCurrentNick())}" placeholder="닉네임" ${S.nickname?'readonly':''} maxlength="12" />
        ${!S.nickname ? '<input class="form-input" type="password" id="wf-pw" placeholder="비밀번호(선택)" maxlength="20" />' : ''}
      </div>
      <div class="form-row">
        <label class="form-label">제목</label>
        <input class="form-input" type="text" id="wf-title" placeholder="제목을 입력하세요" maxlength="100" />
      </div>
      <div class="form-row">
        <label class="form-label">내용</label>
        <textarea class="form-textarea" id="wf-content" placeholder="내용을 입력하세요.&#10;욕설, 비방, 허위사실은 삭제 및 제재될 수 있습니다."></textarea>
      </div>
      <div class="form-btns">
        <button class="form-submit" onclick="submitPost()">등록</button>
        <button class="form-cancel" onclick="goHome()">취소</button>
      </div>
    </div>
  `;
};

window.submitPost = async function() {
  const title = document.getElementById('wf-title')?.value.trim();
  const content = document.getElementById('wf-content')?.value.trim();
  if (!title) { toast('제목을 입력하세요.'); return; }
  if (!content) { toast('내용을 입력하세요.'); return; }

  const nick = getCurrentNick();
  const nickType = getNickType();

  // get post count for num
  const countSnap = await getDocs(collection(db, 'posts'));
  const num = countSnap.size + 1;

  try {
    const ref = await addDoc(collection(db, 'posts'), {
      title, content, nick, nickType,
      num,
      ipHint: nickType === 'flow' ? getIpHint() : '',
      authorUid: S.uid,
      createdAt: serverTimestamp(),
      views: 0,
      rec: 0,
      commentCount: 0,
      type: 'normal',
    });
    toast('게시글이 등록되었습니다.');
    openPost(ref.id);
  } catch(e) { toast('등록 실패: ' + e.message); }
};

/* ── SIDEBARS ── */
async function loadSidebars() {
  // realtime best
  try {
    const q = query(collection(db, 'posts'), orderBy('rec','desc'), limit(8));
    const snap = await getDocs(q);
    const rtEl = document.getElementById('sb-realtime');
    if (snap.empty) { rtEl.innerHTML = '<div class="slink">인기글이 없습니다</div>'; }
    else {
      rtEl.innerHTML = snap.docs.map((d,i) => {
        const title = d.data().title || '';
        return `<div class="rt-item"><span class="rt-rank">${i+1}</span><span class="rt-txt" onclick="openPost('${d.id}')">${esc(title.length>20?title.slice(0,20)+'…':title)}</span></div>`;
      }).join('');
    }
  } catch(e) {}

  // recent
  try {
    const q = query(collection(db, 'posts'), orderBy('createdAt','desc'), limit(8));
    const snap = await getDocs(q);
    const rcEl = document.getElementById('sb-recent');
    if (snap.empty) { rcEl.innerHTML = '<div class="slink">최근 게시글이 없습니다</div>'; }
    else {
      rcEl.innerHTML = snap.docs.map(d => {
        const title = d.data().title || '';
        return `<div class="slink" onclick="openPost('${d.id}')">${esc(title.length>16?title.slice(0,16)+'…':title)}</div>`;
      }).join('');
    }
  } catch(e) {}
}

</script>
